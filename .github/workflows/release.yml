name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # OIDC token for npm trusted publishing. pnpm exchanges it with npmjs.org for
  # a short-lived publish token and attaches a sigstore provenance attestation —
  # provided a trusted publisher is configured for each package on npmjs.com
  # (repo + this workflow). Without that, pnpm falls back to NPM_TOKEN and skips
  # provenance. Requires pnpm >= 11.11 (see packageManager).
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # An unset RELEASE_PAT surfaces one step later as an opaque checkout auth
      # failure, which reads like a GitHub outage rather than a missing secret.
      # (An *expired* PAT is non-empty and still gets the opaque error — the
      # message below is the first place to look either way.)
      - name: Check RELEASE_PAT is set
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          if [ -z "${RELEASE_PAT:-}" ]; then
            echo "::error::RELEASE_PAT is not set. Create a fine-grained PAT scoped to amemhq/amem with Contents: read+write and Pull requests: read+write, and store it as the RELEASE_PAT repository secret."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Same PAT as the changesets step below, for the same reason: this is
          # the credential persisted into the git remote, so it is what pushes
          # `changeset-release/main`. A push made with GITHUB_TOKEN raises no
          # events, which would leave the release PR's `synchronize` runs dead
          # even once the PR itself was created by a real user.
          token: ${{ secrets.RELEASE_PAT }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Retry: package postinstalls fetch native binaries at install time, and a
      # transient network failure in the runner fails the whole job for reasons
      # that have nothing to do with the change under test. Seen three times
      # recently — twice as ENETUNREACH in onnxruntime-node's postinstall, once
      # as a timeout in pnpm's own signature check — so this guards the step, not
      # one package. A real breakage still fails all three attempts.
      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            if pnpm install --frozen-lockfile; then exit 0; fi
            echo "::warning::pnpm install failed (attempt $attempt/3); retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          echo "::error::pnpm install failed after 3 attempts"
          exit 1

      # Opens the release PR when changesets exist; once that PR is merged
      # (versions bumped), the next run publishes to npm.
      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1
        with:
          version: pnpm run version
          publish: pnpm run release
          # Default is a bare "Version Packages", which reads as noise in the PR
          # list and breaks the repo's conventional-commit history. Name it for
          # what it is; the same string is used for the squash-merge commit.
          title: 'chore(release): version packages'
          commit: 'chore(release): version packages'
        env:
          # A PAT, not GITHUB_TOKEN, for two reasons that both bite this repo:
          # GITHUB_TOKEN cannot open a pull request at all under an org that has
          # not enabled "Allow GitHub Actions to create and approve pull
          # requests" (the transfer to amemhq reset that, and this step started
          # failing with "GitHub Actions is not permitted to create or approve
          # pull requests"); and even where it can, the PR it opens triggers no
          # workflows, so the release PR's CI sits at action_required until
          # somebody approves it by hand every single release.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
          # Fallback auth for when OIDC trusted publishing is unavailable. pnpm
          # prefers OIDC when it can (and only then is provenance attached), so
          # this token is used only if the OIDC exchange is skipped. It can be
          # dropped once trusted publishing is confirmed working for every package.
          # (NPM_CONFIG_PROVENANCE is intentionally absent: pnpm ignores it — its
          # provenance comes from the OIDC path above, not that npm-CLI flag.)
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Mirror the plugin to ClawHub from the SAME freshly-built dist/ that was
      # just published to npm, so the two registries stay on the exact same
      # version. Runs only when changesets actually published openclaw-amem —
      # skipped on the runs that merely open/update the Version PR.
      - name: Publish plugin to ClawHub
        if: steps.changesets.outputs.published == 'true' && contains(steps.changesets.outputs.publishedPackages, 'openclaw-amem')
        working-directory: packages/openclaw-amem
        run: |
          # Pin the CLI: an unpinned global install lets a broken clawhub
          # release fail this step *after* npm has already published, leaving
          # the two registries on different versions. 0.23.1 is the version
          # OpenClaw itself pins for its own plugin publishes.
          npm i -g clawhub@0.23.1
          clawhub login --token "$CLAWHUB_TOKEN"
          pnpm pack --pack-destination "$RUNNER_TEMP"
          rm -rf "$RUNNER_TEMP/clawhub-pkg" && mkdir -p "$RUNNER_TEMP/clawhub-pkg"
          tar -xzf "$RUNNER_TEMP"/openclaw-amem-*.tgz -C "$RUNNER_TEMP/clawhub-pkg"
          # Feed the just-released CHANGELOG.md section (changesets writes it) as
          # the release notes so npm and ClawHub show the same changelog.
          NOTE=$(awk '/^## /{n++} n==1{print} n==2{exit}' CHANGELOG.md)
          # Code plugins require source attribution; use the exact release commit.
          clawhub --no-input package publish "$RUNNER_TEMP/clawhub-pkg/package" \
            --family code-plugin --owner heichaowo \
            --source-repo "$GITHUB_REPOSITORY" \
            --source-commit "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF_NAME" \
            --source-path packages/openclaw-amem \
            --changelog "$NOTE"
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
