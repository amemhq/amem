name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for the whole workflow: every job here only reads the repo.
# Set at workflow level so all jobs inherit it (CodeQL actions/missing-workflow-permissions).
permissions:
  contents: read

jobs:
  # The release PR carries main's code plus generated version bumps and CHANGELOG
  # entries — main has already run all of this against those exact sources. Every
  # merge to main force-pushes that branch, so leaving it in re-ran the full
  # matrix plus integration for nothing, every time. `release-pr` below covers
  # what the version bump itself can break.
  check:
    if: github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # Retry: package postinstalls fetch native binaries at install time, and a
      # transient network failure in the runner fails the whole job for reasons
      # that have nothing to do with the change under test. Seen three times
      # recently — twice as ENETUNREACH in onnxruntime-node's postinstall, once
      # as a timeout in pnpm's own signature check — so this guards the step, not
      # one package. A real breakage still fails all three attempts.
      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            if pnpm install --frozen-lockfile; then exit 0; fi
            echo "::warning::pnpm install failed (attempt $attempt/3); retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          echo "::error::pnpm install failed after 3 attempts"
          exit 1

      # `pnpm -r <script>` skips packages that do not define <script>, without
      # saying so. Guard the Lint and Typecheck steps below against a package
      # quietly opting out of them.
      - name: Assert every package defines typecheck and lint
        run: node tools/assert-package-scripts.mjs

      # A published package must not depend on a private workspace one, or the
      # registry install 404s on it — this is what broke openclaw-amem@1.1.3.
      - name: Assert no published package depends on a private one
        run: node tools/assert-no-private-deps.mjs

      # Every env var the bundled code reads, and every plugin config key it
      # accepts, must be declared in the plugin manifest (or ClawHub silently
      # holds the release as it did for 1.2.0, and the host silently drops the
      # key) and documented in the config reference (or the wiki drifts).
      - name: Assert config is declared and documented
        run: node tools/assert-config-documented.mjs

      # ClawHub reads the version out of the manifest, not package.json, so the
      # two drifting apart ships the wrong number to users with nothing failing.
      - name: Assert the plugin manifest version matches package.json
        run: node tools/assert-plugin-version-synced.mjs

      - name: Format check
        run: pnpm format

      - name: Lint
        run: pnpm -r lint

      # Must precede Typecheck: openclaw-amem inlines the amem engine, whose
      # `exports.types` points into its gitignored dist/. `pnpm -r build` is
      # topological, so amem builds first and the declarations exist.
      - name: Build
        run: pnpm -r build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Unit tests
        run: pnpm test:unit

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # gitleaks-action bills organisation-owned repos, which this became when the
      # repo moved to amemhq: it now dies in 8s with "[amemhq] is an organization.
      # License key is required." The gitleaks CLI itself is MIT and unrestricted,
      # so run the binary — same engine, same default ruleset, no wrapper.
      # --redact keeps any match out of the log; the finding's location is enough
      # to act on and the value must never be printed.
      - name: Credential scan (gitleaks)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSLO "$base/$tarball"
          curl -sSLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${tarball}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks" git . --redact --exit-code 1

  # Integration tests drive the real memory pipeline against a Qdrant service
  # container, with the LLM and embeddings mocked (deterministic, no API calls,
  # no model download). Unit tests run in the check job above.
  integration:
    if: github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant
        ports:
          - 6333:6333
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm

      # Retry: package postinstalls fetch native binaries at install time, and a
      # transient network failure in the runner fails the whole job for reasons
      # that have nothing to do with the change under test. Seen three times
      # recently — twice as ENETUNREACH in onnxruntime-node's postinstall, once
      # as a timeout in pnpm's own signature check — so this guards the step, not
      # one package. A real breakage still fails all three attempts.
      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            if pnpm install --frozen-lockfile; then exit 0; fi
            echo "::warning::pnpm install failed (attempt $attempt/3); retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          echo "::error::pnpm install failed after 3 attempts"
          exit 1

      - name: Wait for Qdrant
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:6333/readyz >/dev/null 2>&1; then
              echo "Qdrant is ready"; exit 0
            fi
            sleep 1
          done
          echo "Qdrant did not become ready in time"; exit 1

      - name: Integration tests
        run: pnpm test:integration

  # The release PR's own check. Its diff is package.json versions, CHANGELOGs and
  # deleted changeset files, so the only things that can be wrong are the ones a
  # generated version bump gets wrong: a manifest left behind by a bare
  # `changeset version`, and a lockfile that the bump did not update.
  release-pr:
    if: github.head_ref == 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm

      # --frozen-lockfile is the assertion: `changeset version` edits
      # package.json without running install, so a bump that should have moved
      # the lockfile and did not fails right here.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Assert the plugin manifest version matches package.json
        run: node tools/assert-plugin-version-synced.mjs

      - name: Assert no published package depends on a private one
        run: node tools/assert-no-private-deps.mjs

      # Only meaningful here: on any other branch the version has not been bumped
      # yet, so there is nothing to look up. The publish step falls back silently
      # when the section is missing, which is right for a release but means the
      # omission is invisible until someone reads the ClawHub listing.
      - name: Assert the release has a plugin-facing release note
        run: node tools/assert-release-note-present.mjs

  changeset-check:
    # Skip PRs that never carry a changeset by design: the changesets bot's
    # own "Version Packages" PR (it consumes them), and dependency bumps
    # (a changeset is added by the maintainer when the bump is released).
    if: >-
      github.event_name == 'pull_request'
      && github.head_ref != 'changeset-release/main'
      && github.actor != 'renovate[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm

      # Retry: package postinstalls fetch native binaries at install time, and a
      # transient network failure in the runner fails the whole job for reasons
      # that have nothing to do with the change under test. Seen three times
      # recently — twice as ENETUNREACH in onnxruntime-node's postinstall, once
      # as a timeout in pnpm's own signature check — so this guards the step, not
      # one package. A real breakage still fails all three attempts.
      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            if pnpm install --frozen-lockfile; then exit 0; fi
            echo "::warning::pnpm install failed (attempt $attempt/3); retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          echo "::error::pnpm install failed after 3 attempts"
          exit 1

      # Fails the PR if any workspace package changed without a changeset —
      # including the private amem engine, because it is bundled into the
      # published plugin, so engine changes really do ship. When a change
      # genuinely needs no release, say so explicitly with
      # `pnpm changeset add --empty`. Changes outside a package (docs, CI)
      # are not flagged.
      - name: Require a changeset
        run: pnpm changeset status --since=origin/${{ github.base_ref }}

  # The one status check to require in branch protection. It fails if any job
  # above failed or was cancelled, and stays green when a job legitimately skips
  # (changeset-check on the Version PR or a Dependabot PR). Because it is a
  # single stable name, changing the Node matrix never breaks the ruleset.
  ci-ok:
    if: always()
    needs: [check, secret-scan, integration, changeset-check, release-pr]
    runs-on: ubuntu-latest
    steps:
      - name: Verify every CI job succeeded or was skipped
        run: |
          results="${{ join(needs.*.result, ',') }}"
          echo "job results: $results"
          if echo "$results" | grep -qE '(^|,)(failure|cancelled)(,|$)'; then
            echo "::error::a required CI job did not succeed"
            exit 1
          fi
          echo "all CI jobs succeeded or were skipped"
